name: Alerta DevOps ITLA

on:
  push:
    branches:
      - main

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Hola Mundo
        run: node HolaMundo.js

      - name: Enviar notificación a ntfy
        run: |
          curl \
            -H "Title: GitHub Actions - ITLA" \
            -H "Priority: default" \
            -H "Tags: github,devops" \
            -d "Se ha realizado un push a la rama main del repositorio." \
            https://ntfy.sh/devops-itla
